<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MoneyNote Offline</title>
    <link rel="stylesheet" href="css/app.css">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
    <!-- Fonts - system fonts will be used to keep it offline -->
</head>

<body>
    <div id="passcode-overlay" class="hidden">
        <div class="passcode-container">
            <h2>Enter Passcode</h2>
            <div class="passcode-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
            <div class="numpad passcode-pad">
                <button data-val="1">1</button>
                <button data-val="2">2</button>
                <button data-val="3">3</button>
                <button data-val="4">4</button>
                <button data-val="5">5</button>
                <button data-val="6">6</button>
                <button data-val="7">7</button>
                <button data-val="8">8</button>
                <button data-val="9">9</button>
                <button data-val="biometric" class="action-btn">🖐️</button>
                <button data-val="0">0</button>
                <button data-val="back" class="action-btn">⌫</button>
            </div>
            <p id="passcode-error" class="error-msg hidden">Incorrect Passcode</p>
            <button id="reset-app-btn" class="text-btn danger mt-4">Forgot PIN? Reset App</button>
        </div>
    </div>

    <div id="app" class="app-container">
        <!-- Main Content Area -->
        <main id="main-view"></main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-view="entry">
                <span class="icon">➕</span>
                <span class="label">Entry</span>
            </button>
            <button class="nav-item" data-view="calendar">
                <span class="icon">📅</span>
                <span class="label">Calendar</span>
            </button>
            <button class="nav-item" data-view="reports">
                <span class="icon">📊</span>
                <span class="label">Reports</span>
            </button>
            <button class="nav-item" data-view="settings">
                <span class="icon">⚙️</span>
                <span class="label">Settings</span>
            </button>
        </nav>
    </div>

    <!-- Scripts -->
    <!-- Libraries -->
    <script src="lib/html2pdf.bundle.min.js"></script>
    <script src="lib/html2canvas.min.js"></script>

    <!-- App Logic -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
